[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pew"
version = "0.1.0"
description = "Run commands, push files, and diff files across systems, using your existing Ansible inventory as the source of truth."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
pew = "pew:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["pew"]
