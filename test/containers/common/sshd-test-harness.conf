# Appended to /etc/ssh/sshd_config in each test container.
# Local throwaway test lab — key-only auth, both testuser (passwordless
# sudo) and root can log in, so pew's --root/--remote-user flows are both
# exercisable. Never use these settings on anything but a disposable local
# container.
PasswordAuthentication no
PermitRootLogin prohibit-password
ForceCommand /usr/local/bin/log-and-run.sh
Subsystem sftp /usr/local/bin/log-sftp.sh
